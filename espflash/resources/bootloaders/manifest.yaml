# Bootloader generation manifest for `cargo run -p xtask -- build-bootloaders`.
#
# The committed binaries are ESP-IDF second-stage bootloaders generated from a
# minimal ESP-IDF project with the ESP-IDF refs and per-target sdkconfig fragments
# listed below.
#
# Each entry also builds a `-qio` variant with the same settings plus
# `CONFIG_ESPTOOLPY_FLASHMODE_QIO=y`, used for `--flash-mode qio`. It enables
# quad mode on the flash chip itself, so it is never the default: a board may
# use the flash's WP and HD pins for other things.

defaults:
  # release/v6.1 (v6.1-829-g9a97f6c54ec)
  idf_ref: 9a97f6c54ec638111ce55cd36581b3c192f15207
  configs:
    - '# CONFIG_BOOTLOADER_COMPILE_TIME_DATE is not set'

bootloaders:
  - name: esp32
    target: esp32
    output: esp32-bootloader.bin

  - name: esp32-26mhz
    target: esp32
    output: esp32_26-bootloader.bin
    configs:
      - CONFIG_XTAL_FREQ_26=y
      - CONFIG_XTAL_FREQ=26

  - name: esp32c2
    target: esp32c2
    output: esp32c2-bootloader.bin
    configs:
      - CONFIG_ESPTOOLPY_FLASHSIZE_64MB=y
      - CONFIG_ESPTOOLPY_FLASHSIZE="64MB"

  - name: esp32c2-26mhz
    target: esp32c2
    output: esp32c2_26-bootloader.bin
    configs:
      - CONFIG_XTAL_FREQ_26=y
      - CONFIG_XTAL_FREQ=26
      - CONFIG_ESPTOOLPY_FLASHSIZE_64MB=y
      - CONFIG_ESPTOOLPY_FLASHSIZE="64MB"

  - name: esp32c3
    target: esp32c3
    output: esp32c3-bootloader.bin

  - name: esp32c5
    target: esp32c5
    output: esp32c5-bootloader.bin

  - name: esp32c6
    target: esp32c6
    output: esp32c6-bootloader.bin
    configs:
      - CONFIG_ESPTOOLPY_FLASHSIZE_64MB=y
      - CONFIG_ESPTOOLPY_FLASHSIZE="64MB"

  - name: esp32c61
    target: esp32c61
    output: esp32c61-bootloader.bin
    configs:
      - CONFIG_ESPTOOLPY_FLASHSIZE_64MB=y
      - CONFIG_ESPTOOLPY_FLASHSIZE="64MB"

  - name: esp32h2
    target: esp32h2
    output: esp32h2-bootloader.bin
    configs:
      - CONFIG_ESPTOOLPY_FLASHSIZE_64MB=y
      - CONFIG_ESPTOOLPY_FLASHSIZE="64MB"

  - name: esp32h21
    target: esp32h21
    output: esp32h21-bootloader.bin
    idf_ref: c712a0dde385d659a1470a136251980d31a70bc1
    preview: true
    configs:
      - CONFIG_ESPTOOLPY_FLASHSIZE_64MB=y
      - CONFIG_ESPTOOLPY_FLASHSIZE="64MB"

  - name: esp32h4-v0.0
    target: esp32h4
    output: esp32h4-v0.0-bootloader.bin
    preview: true
    configs:
      - CONFIG_ESPTOOLPY_FLASHSIZE_64MB=y
      - CONFIG_ESPTOOLPY_FLASHSIZE="64MB"

  - name: esp32h4-v0.2
    target: esp32h4
    output: esp32h4-v0.2-bootloader.bin
    # master (v6.1-dev-8798-g4d80c1b29ae), for chip revision v0.2 (ECO2) and
    # later, which release/v6.1 does not support
    idf_ref: 4d80c1b29aeabc8e735ffc6e1be9bb23e95d1d5d
    preview: true
    configs:
      - CONFIG_ESPTOOLPY_FLASHSIZE_64MB=y
      - CONFIG_ESPTOOLPY_FLASHSIZE="64MB"

  - name: esp32p4-v0
    target: esp32p4
    output: esp32p4-v0-bootloader.bin
    configs:
      - CONFIG_ESP32P4_SELECTS_REV_LESS_V3=y
      - CONFIG_ESP32P4_REV_MIN_100=y

  - name: esp32p4-v3
    target: esp32p4
    output: esp32p4-v3-bootloader.bin
    configs:
      - CONFIG_ESP32P4_REV_MIN_300=y

  - name: esp32s2
    target: esp32s2
    output: esp32s2-bootloader.bin

  - name: esp32s3
    target: esp32s3
    output: esp32s3-bootloader.bin

  - name: esp32s31
    target: esp32s31
    output: esp32s31-bootloader.bin
    preview: true
    configs:
      - CONFIG_ESPTOOLPY_FLASHSIZE_64MB=y
      - CONFIG_ESPTOOLPY_FLASHSIZE="64MB"
