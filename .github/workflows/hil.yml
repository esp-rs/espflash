name: HIL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      repository:
        description: "Owner and repository to test"
        required: true
        default: "esp-rs/espflash"
      branch:
        description: "Branch, tag or SHA to checkout."
        required: true
        default: "main"

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: debug

# Cancel any currently running workflows from the same PR, branch, or
# tag when a new workflow is triggered.
#
# https://stackoverflow.com/a/66336834
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  build-packages:
    name: Build packages | aarch64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.inputs.repository || github.repository }}
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: cross build --release --target aarch64-unknown-linux-gnu -p espflash -p xtask

      - name: Upload espflash-aarch64
        uses: actions/upload-artifact@v4
        with:
          name: espflash-aarch64
          path: target/aarch64-unknown-linux-gnu/release/espflash
          if-no-files-found: error

      - name: Upload xtask-aarch64
        uses: actions/upload-artifact@v4
        with:
          name: xtask-aarch64
          path: target/aarch64-unknown-linux-gnu/release/xtask
          if-no-files-found: error

  run-tests:
    if: github.repository_owner == 'esp-rs'
    name: HIL | ${{ matrix.target.soc }} | ${{ matrix.target.port }}
    needs: build-packages
    runs-on: [self-hosted, linux, ARM64, "${{ matrix.target.runner }}"]
    env:
      ESPFLASH_PORT: /dev/serial_ports/${{ matrix.target.port }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - soc: esp32c2
            runner: esp32c2-jtag
            port: uart
          - soc: esp32c3
            runner: esp32c3-usb
            port: usb
          - soc: esp32c5
            runner: esp32c5-usb
            port: usb
          - soc: esp32c5
            runner: esp32c5-usb
            port: uart
          - soc: esp32c6
            runner: esp32c6-usb
            port: usb
          - soc: esp32c6
            runner: esp32c6-usb
            port: uart
          - soc: esp32c61
            runner: esp32c61-usb
            port: usb
          - soc: esp32c61
            runner: esp32c61-usb
            port: uart
          - soc: esp32h2
            runner: esp32h2-usb
            port: usb
          - soc: esp32h2
            runner: esp32h2-usb
            port: uart
          - soc: esp32p4
            runner: esp32p4
            port: usb
          - soc: esp32
            runner: esp32-jtag
            port: uart
          - soc: esp32s2
            runner: esp32s2-jtag
            port: uart
          - soc: esp32s3
            runner: esp32s3-usb
            port: usb
          - soc: esp32s3
            runner: esp32s3-usb
            port: uart
          - soc: esp32s31
            runner: esp32s31-jtag
            port: uart

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: espflash-aarch64
          path: espflash_app

      - uses: actions/download-artifact@v7
        with:
          name: xtask-aarch64
          path: xtask_app

      - name: Set up binaries
        run: |
          chmod +x espflash_app/espflash
          chmod +x xtask_app/xtask
          echo "$PWD/espflash_app" >> "$GITHUB_PATH"
          echo "$PWD/xtask_app" >> "$GITHUB_PATH"

      - name: Reset device
        run: |
          espflash reset
          sleep 5

      - name: Run all tests
        run: xtask run-tests --chip ${{ matrix.target.soc }} -t 60 --no-build

  # SDM Tests (VM - ESP32C6)
  build-sdm-packages:
    name: Build SDM packages
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.inputs.repository || github.repository }}
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get -y install curl musl-tools pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: cargo build --release -p espflash -p xtask

      - name: Upload espflash
        uses: actions/upload-artifact@v4
        with:
          name: espflash
          path: target/release/espflash
          if-no-files-found: error

      - name: Upload xtask
        uses: actions/upload-artifact@v4
        with:
          name: xtask
          path: target/release/xtask
          if-no-files-found: error
  run-sdm-tests:
    if: github.repository_owner == 'esp-rs'
    name: HIL (SDM) | esp32c6
    needs: build-sdm-packages
    runs-on: [self-hosted, "linux", "x64", "esp32c6"]
    env:
      ESPFLASH_PORT: /dev/serial_ports/esp32c6

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: espflash
          path: espflash_app

      - uses: actions/download-artifact@v7
        with:
          name: xtask
          path: xtask_app

      - name: Set up binaries
        run: |
          chmod +x espflash_app/espflash
          chmod +x xtask_app/xtask
          echo "$PWD/espflash_app" >> "$GITHUB_PATH"
          echo "$PWD/xtask_app" >> "$GITHUB_PATH"

      - name: Run all tests
        run: xtask run-tests --chip esp32c6 -t 60 --no-build --sdm
