name: HIL

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('HIL for PR #{0} ({1}; {2}) [dispatch-id: {3}]', inputs.pr_number, inputs.chips, inputs.suite, inputs.distinct_id) ||
      format('HIL ({0})', github.event_name) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      repository:
        description: "Owner and repository to test"
        required: true
        default: "esp-rs/espflash"
      branch:
        description: "Exact commit SHA to test"
        required: true
        default: "main"
      pr_number:
        description: "Pull request number for slash-command runs"
        required: false
        default: ""
      chips:
        description: 'Space-separated chips to test, or "all"'
        required: true
        default: "all"
      suite:
        description: "Test suite to run"
        required: true
        type: choice
        options: [standard, sdm, full]
        default: full
      distinct_id:
        description: "Correlation marker set by the dispatcher"
        required: false
        default: "manual"

# Build and test jobs run pull request code; jobs that need more declare it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ESPFLASH_SKIP_UPDATE_CHECK: "true"
  RUST_LOG: debug

jobs:
  # Keep reporting the required `hil-gate` check on ordinary pull requests, but
  # defer device access until an authorized slash command or the merge queue.
  resolve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      suite: ${{ steps.matrix.outputs.suite }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve HIL matrix
        id: matrix
        uses: actions/github-script@v7
        env:
          REQUESTED_CHIPS: ${{ github.event_name == 'merge_group' && 'all' || inputs.chips }}
          REQUESTED_SUITE: ${{ github.event_name == 'merge_group' && 'full' || inputs.suite }}
        with:
          script: |
            const { resolveMatrix } = require('./.github/scripts/hil-matrix.js');
            const suite = process.env.REQUESTED_SUITE;
            if (!['standard', 'sdm', 'full'].includes(suite)) {
              core.setFailed(`Unsupported HIL suite: ${suite}`);
              return;
            }
            const { chips, matrix } = resolveMatrix(process.env.REQUESTED_CHIPS);
            if (suite === 'sdm' && !chips.includes('esp32c6')) {
              core.setFailed('The SDM suite is only available for esp32c6');
              return;
            }
            core.setOutput('matrix', JSON.stringify(matrix));
            core.setOutput('suite', suite);
            core.info(`Selected suite ${suite}; chips: ${chips.join(', ')}`);

  build-packages:
    if: needs.resolve.outputs.suite != 'sdm'
    needs: resolve
    name: Build packages | aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.sha }}
          # Pull request code must not see the job token.
          persist-credentials: false

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Slash-command runs build untrusted PR revisions under the default
          # branch ref; do not let those runs write default-branch caches.
          save-if: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Build binaries
        run: cross build --release --target aarch64-unknown-linux-gnu -p espflash -p xtask

      - name: Upload HIL binaries
        uses: actions/upload-artifact@v7
        with:
          name: hil-aarch64
          path: |
            target/aarch64-unknown-linux-gnu/release/espflash
            target/aarch64-unknown-linux-gnu/release/xtask
          if-no-files-found: error
          retention-days: 1

  run-tests:
    if: needs.resolve.outputs.suite != 'sdm' && github.repository_owner == 'esp-rs'
    name: HIL | ${{ matrix.target.soc }} | ${{ matrix.target.port }}
    needs: [resolve, build-packages]
    runs-on: [self-hosted, linux, ARM64, "${{ matrix.target.runner }}"]
    timeout-minutes: 30
    env:
      ESPFLASH_PORT: /dev/serial_ports/${{ matrix.target.port }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.sha }}
          # Pull request code must not see the job token.
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: hil-aarch64
          path: hil-bin

      - name: Set up binaries
        run: |
          chmod +x hil-bin/espflash hil-bin/xtask
          echo "$PWD/hil-bin" >> "$GITHUB_PATH"

      - name: Prepare device
        run: |
          port_kind="${{ matrix.target.port }}"
          uart_port=/dev/serial_ports/uart

          wait_for_port() {
            for _ in {1..30}; do
              [[ -e "$ESPFLASH_PORT" ]] && return 0
              sleep 1
            done
            echo "Serial port did not appear: $ESPFLASH_PORT" >&2
            return 1
          }

          reset_device() {
            timeout --signal=TERM --kill-after=5s 20s \
              espflash reset --port "$1"
          }

          recover_usb_via_uart() {
            if [[ "$port_kind" != "usb" || ! -e "$uart_port" ]]; then
              return 1
            fi
            echo "Recovering native USB through $uart_port"
            if ! reset_device "$uart_port"; then
              echo "UART recovery failed on $uart_port" >&2
              return 1
            fi
            # Give the application time to re-enumerate its native USB port.
            sleep 2
          }

          # Firmware left by a previous run may have disabled native USB.
          if [[ ! -e "$ESPFLASH_PORT" && "$port_kind" == "usb" && -e "$uart_port" ]]; then
            recover_usb_via_uart
          fi
          wait_for_port

          # A USB node can remain present while the device is unresponsive. If
          # reset fails, recover through UART and retry the selected USB port.
          if ! reset_device "$ESPFLASH_PORT"; then
            echo "Reset failed on $ESPFLASH_PORT" >&2
            if ! recover_usb_via_uart; then
              echo "No successful recovery path is available" >&2
              exit 1
            fi
            wait_for_port
            reset_device "$ESPFLASH_PORT"
          fi
          sleep 5

      - name: Run all tests
        run: >-
          xtask run-tests --chip ${{ matrix.target.soc }} --timeout 90 --baud 921600
          --espflash "$PWD/hil-bin/espflash" ${{ matrix.target.extraArgs }}

  build-sdm-packages:
    if: needs.resolve.outputs.suite == 'sdm' || needs.resolve.outputs.suite == 'full'
    needs: resolve
    name: Build SDM packages
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.sha }}
          # Pull request code must not see the job token.
          persist-credentials: false

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get -y install curl musl-tools pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Build binaries
        run: cargo build --release -p espflash -p xtask

      - name: Upload HIL binaries
        uses: actions/upload-artifact@v7
        with:
          name: hil-sdm
          path: |
            target/release/espflash
            target/release/xtask
          if-no-files-found: error
          retention-days: 1

  run-sdm-tests:
    if: >-
      (needs.resolve.outputs.suite == 'sdm' || needs.resolve.outputs.suite == 'full') &&
      github.repository_owner == 'esp-rs'
    name: HIL (SDM) | esp32c6
    needs: [resolve, build-sdm-packages]
    runs-on: [self-hosted, linux, x64, esp32c6]
    timeout-minutes: 30
    env:
      ESPFLASH_PORT: /dev/serial_ports/esp32c6
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.sha }}
          # Pull request code must not see the job token.
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: hil-sdm
          path: hil-bin

      - name: Set up binaries
        run: |
          chmod +x hil-bin/espflash hil-bin/xtask
          echo "$PWD/hil-bin" >> "$GITHUB_PATH"

      - name: Run all tests
        run: >-
          xtask run-tests --chip esp32c6 --timeout 90 --baud 921600 --sdm
          --espflash "$PWD/hil-bin/espflash"

  hil-gate:
    name: hil-gate
    if: always()
    needs: [resolve, build-packages, run-tests]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Defer HIL until requested or queued
        if: github.event_name == 'pull_request'
        run: echo "HIL is deferred until an authorized /hil command or the merge queue."

      # Slash-command runs execute PR-built binaries, but their gate evaluator
      # comes from the trusted default branch rather than the tested revision.
      - uses: actions/checkout@v6
        if: github.event_name != 'pull_request'
        with:
          # A dispatched run must use control-plane code from the trusted
          # default branch. A merge-group run uses the queued revision so this
          # workflow can bootstrap its own evaluator before first merge.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}
          sparse-checkout: .github/scripts
          path: trusted-workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Check build results
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          SUITE: ${{ needs.resolve.outputs.suite }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          BUILD_RESULT: ${{ needs.build-packages.result }}
        with:
          script: |
            const suite = process.env.SUITE;
            const requireSuccess = (name, result) => {
              if (result !== 'success') core.setFailed(`${name} did not succeed (${result})`);
            };
            requireSuccess('Matrix resolution', process.env.RESOLVE_RESULT);
            if (suite !== 'sdm') requireSuccess('HIL build', process.env.BUILD_RESULT);

      - name: Evaluate device results
        if: >-
          github.event_name != 'pull_request' &&
          needs.resolve.outputs.suite != 'sdm' &&
          needs.build-packages.result == 'success'
        uses: actions/github-script@v7
        env:
          STRICT: ${{ github.event_name != 'merge_group' }}
        with:
          script: |
            const { evaluateHilGate } = require('./trusted-workflow/.github/scripts/hil-gate.js');
            await evaluateHilGate({
              github,
              context,
              core,
              maxFailures: process.env.STRICT === 'true' ? 0 : undefined,
            });

  sdm-gate:
    name: sdm-gate
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (needs.resolve.outputs.suite == 'sdm' || needs.resolve.outputs.suite == 'full')
    needs: [resolve, build-sdm-packages, run-sdm-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check SDM results
        uses: actions/github-script@v7
        env:
          SDM_BUILD_RESULT: ${{ needs.build-sdm-packages.result }}
          SDM_RESULT: ${{ needs.run-sdm-tests.result }}
        with:
          script: |
            const requireSuccess = (name, result) => {
              if (result !== 'success') core.setFailed(`${name} did not succeed (${result})`);
            };
            requireSuccess('SDM build', process.env.SDM_BUILD_RESULT);
            requireSuccess('SDM run', process.env.SDM_RESULT);

  # The dispatcher cannot report the verdict: a run it starts with GITHUB_TOKEN
  # raises no workflow_run event. Reporting from inside the run also covers
  # re-runs, which re-run this job along with the jobs it depends on.
  report:
    name: report
    needs:
      [resolve, build-packages, run-tests, build-sdm-packages, run-sdm-tests, hil-gate, sdm-gate]
    # `always()` rather than `!cancelled()`: a cancelled run must still report
    # its verdict.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Dispatched runs execute from the trusted default branch.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          path: trusted-workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Update HIL status comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        with:
          script: |
            const { runConclusion, updateRunStatus } = require('./trusted-workflow/.github/scripts/hil-status.js');
            await updateRunStatus({
              github,
              context,
              core,
              pr: Number(process.env.PR_NUMBER),
              conclusion: runConclusion(JSON.parse(process.env.RESULTS)),
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
