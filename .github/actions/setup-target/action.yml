name: Setup target Build Environment
description: Setup an ARM or x86_64 build environment

inputs:
  arch:
    default: x86_64
    required: false
  target:
    default: x86_64-unknown-linux-gnu
    required: false
  toolchain:
    default: stable
    required: false
  components:
    required: false

runs:
  using: composite
  steps:
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ inputs.toolchain }}
        target: ${{ inputs.target }}
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.target }}

    # Only the cross-compiler is needed: no crate links against target system
    # libraries, so the multiarch packages from ports.ubuntu.com are not required.
    - if: inputs.arch != 'x86_64'
      name: Install cross-compiler
      shell: bash
      run: |
        if [[ "${{ inputs.arch }}" != armhf ]]; then
          echo "Unsupported cross-compile arch: ${{ inputs.arch }}"
          exit 1
        fi
        sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
        echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV

    - if: inputs.target == 'x86_64-unknown-linux-gnu' || inputs.target == 'x86_64-unknown-linux-musl' || inputs.target == 'aarch64-unknown-linux-musl'
      name: Install dependencies (native linux)
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get -y install musl-tools pkg-config
